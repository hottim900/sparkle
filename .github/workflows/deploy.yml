name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

env:
  # Set SPARKLE_DIR in GitHub repo Settings → Variables and Secrets → Variables
  SPARKLE_DIR: ${{ vars.SPARKLE_DIR || '/opt/sparkle' }}

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: self-hosted
    timeout-minutes: 10

    steps:
      - name: Pull latest code
        run: cd $SPARKLE_DIR && git fetch origin main && git checkout main && git pull --ff-only origin main

      - name: Read deployed Node version
        id: node-runtime
        run: echo "version=$(cat "$SPARKLE_DIR/.nvmrc")" >> "$GITHUB_OUTPUT"

      - name: Select patched Node runtime
        # setup-node selects the same patched runtime used by CI and .nvmrc.
        # systemd paths must be updated separately when upgrading Node.
        uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.node-runtime.outputs.version }}

      - name: Install application dependencies
        run: cd $SPARKLE_DIR && npm ci

      - name: Check native SQLite security version
        run: cd $SPARKLE_DIR && npm run security:native

      - name: Build frontend
        run: cd $SPARKLE_DIR && npm run build

      - name: Build MCP server
        run: cd $SPARKLE_DIR/mcp-server && npm ci && npm run build

      - name: Validate migrations against production DB
        run: |
          cd $SPARKLE_DIR
          timeout 10 node --env-file=.env --import tsx -e "
            import './server/db/index.js';
            console.log('Migration validation passed');
            process.exit(0);
          " || {
            echo '❌ Migration validation failed — aborting deploy (old service still running)'
            exit 1
          }

      - name: Restart services
        run: sudo systemctl restart sparkle sparkle-mcp-http

      - name: Health check
        run: |
          for i in 1 2 3 4 5; do
            sleep 2
            if curl -sf http://localhost:3000/api/health; then
              echo "Deploy successful — health check passed"
              exit 0
            fi
            echo "Attempt $i failed, retrying..."
          done
          echo "Health check failed after 5 attempts"
          exit 1
